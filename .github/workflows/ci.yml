# Written for plan task G-05. NOT pushed or enabled: this repository has no
# remote CI yet. Before enabling, pin every `uses:` to a commit SHA.
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true
      - run: ./tool/bootstrap.sh
      - run: ./tool/ci.sh

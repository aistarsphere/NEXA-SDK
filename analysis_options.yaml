# Shared lint baseline for every package in the workspace.
# Packages include this file; they may only tighten, never loosen, rules.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.config.dart"
    - "**/l10n/generated/**"
  errors:
    invalid_annotation_target: ignore
    missing_required_param: error
    missing_return: error

linter:
  rules:
    prefer_single_quotes: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    avoid_print: true
    always_declare_return_types: true
    avoid_dynamic_calls: true
    unawaited_futures: true
    directives_ordering: true
    sort_pub_dependencies: true
    use_super_parameters: true
    require_trailing_commas: true
    cancel_subscriptions: true
    close_sinks: true
    avoid_slow_async_io: true
    prefer_relative_imports: false
    always_use_package_imports: true
    # Named parameters cannot initialise private fields with `this._x`.
    prefer_initializing_formals: false

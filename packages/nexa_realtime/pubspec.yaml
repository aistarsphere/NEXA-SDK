name: nexa_realtime
description: NEXA realtime voice transport over the official LiveKit Flutter SDK (WebRTC). Separate from nexa_core so text-only consumers do not pay for native WebRTC dependencies.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  livekit_client: ^2.13.1
  nexa_core: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

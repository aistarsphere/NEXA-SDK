name: nexa_core
description: NEXA shared contracts - configuration, conversation events, tool contracts, errors, transport interfaces and the realtime voice state machine. Pure Dart; no Flutter dependency.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  clock: ^1.1.2
  collection: ^1.19.1
  crypto: ^3.0.6
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  meta: ^1.17.0
  pinenacl: ^0.6.0
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  test: ^1.25.0

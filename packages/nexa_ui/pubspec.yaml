name: nexa_ui
description: NEXA Material 3 Expressive design system for Flutter - Coffee & Mocha tokens, bilingual typography (Noto Sans / Tajawal), localization and reusable chat components. UI only; no networking or state management.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  nexa_core: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  fonts:
    - family: NotoSans
      fonts:
        - asset: fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: fonts/NotoSans-Medium.ttf
          weight: 500
        - asset: fonts/NotoSans-SemiBold.ttf
          weight: 600
        - asset: fonts/NotoSans-Bold.ttf
          weight: 700
    - family: Tajawal
      fonts:
        - asset: fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: fonts/Tajawal-Bold.ttf
          weight: 700
